name: Market Data Pipeline

on:
  schedule:
    # 历史数据：每周一 01:00 (UTC) 全量刷新一次
    - cron: "0 1 * * 1"
    # 当日数据：每天收盘后增量更新
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：historical=全量历史, daily=当日增量, meta=非K线数据"
        required: true
        default: "daily"
        type: choice
        options:
          - historical
          - daily
          - meta

env:
  PYTHON_VERSION: "3.11"

# 拉取数据后提交回仓库
permissions:
  contents: write

jobs:
  # ============================================================
  # 历史数据：每个市场一个独立 job，异步并行拉取
  # ============================================================
  historical-us:
    name: Historical · US
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'historical') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: us
      mode: historical

  historical-hk:
    name: Historical · HK
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'historical') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: hk
      mode: historical

  historical-cn:
    name: Historical · CN
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'historical') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: cn
      mode: historical

  historical-kr:
    name: Historical · KR
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'historical') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: kr
      mode: historical

  # ============================================================
  # 当日数据：每个市场一个独立 job，异步并行拉取
  # ============================================================
  daily-us:
    name: Daily · US
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: us
      mode: daily

  daily-hk:
    name: Daily · HK
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: hk
      mode: daily

  daily-cn:
    name: Daily · CN
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: cn
      mode: daily

  daily-kr:
    name: Daily · KR
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: kr
      mode: daily

  # ============================================================
  # 非K线数据（meta）：每个市场一个独立 job，异步并行拉取
  # ============================================================
  meta-us:
    name: Meta · US
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'meta') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: us
      mode: meta

  meta-hk:
    name: Meta · HK
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'meta') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: hk
      mode: meta

  meta-cn:
    name: Meta · CN
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'meta') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: cn
      mode: meta

  meta-kr:
    name: Meta · KR
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'meta') }}
    uses: ./.github/workflows/step-data.yml
    with:
      region: kr
      mode: meta