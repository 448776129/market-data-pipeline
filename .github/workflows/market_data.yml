name: Market Data Pipeline

on:
  schedule:
    # 每日增量更新（日K + 分钟K）：每 1 小时
    # 指数成分股清单 / 历史日K全量 / 历史分钟K全量 均仅手动触发
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：historical=日K全量, daily=日K增量, minute=分钟K, universe=指数清单"
        required: true
        default: "daily"
        type: choice
        options:
          - historical
          - daily
          - minute
          - universe
      index:
        description: "限定指数：all=全部, csi300/csi500/ndx100/sp500/hsi=单指数"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - csi300
          - csi500
          - ndx100
          - sp500
          - hsi

env:
  PYTHON_VERSION: "3.11"

# 拉取数据后提交回仓库
permissions:
  contents: write

jobs:
  # ============================================================
  # 指数成分股清单：更新5个指数成分股（csi300/csi500/ndx100/sp500/hsi）
  # ============================================================
  universe:
    name: Universe · 更新指数清单
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'universe' || github.event.inputs.mode == 'historical') }}
    uses: ./.github/workflows/step-data.yml
    with:
      mode: universe

  # ============================================================
  # 历史日K线：按指数拉取，每个指数一个 job（成分股少，无需分批）
  # ============================================================
  historical-csi300:
    name: Historical · 沪深300
    needs: [universe]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'historical' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'csi300') }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: csi300
      mode: historical

  historical-csi500:
    name: Historical · 中证500
    needs: [universe]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'historical' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'csi500') }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: csi500
      mode: historical

  historical-ndx100:
    name: Historical · 纳指100
    needs: [universe]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'historical' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'ndx100') }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: ndx100
      mode: historical

  historical-sp500:
    name: Historical · 标普500
    needs: [universe]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'historical' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'sp500') }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: sp500
      mode: historical

  historical-hsi:
    name: Historical · 恒生HSI
    needs: [universe]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'historical' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'hsi') }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: hsi
      mode: historical

  # ============================================================
  # 当日日K线增量：每1小时，按指数拉取
  # ============================================================
  daily-csi300:
    name: Daily · 沪深300
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'csi300')) }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: csi300
      mode: daily

  daily-csi500:
    name: Daily · 中证500
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'csi500')) }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: csi500
      mode: daily

  daily-ndx100:
    name: Daily · 纳指100
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'ndx100')) }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: ndx100
      mode: daily

  daily-sp500:
    name: Daily · 标普500
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'sp500')) }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: sp500
      mode: daily

  daily-hsi:
    name: Daily · 恒生HSI
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'hsi')) }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: hsi
      mode: daily

  # ============================================================
  # 分钟K线(1m/5m/15m/30m/1h)：每1小时增量更新，按指数拉取
  # ============================================================
  minute-csi300:
    name: Minute · 沪深300
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'minute' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'csi300')) }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: csi300
      mode: minute

  minute-csi500:
    name: Minute · 中证500
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'minute' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'csi500')) }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: csi500
      mode: minute

  minute-ndx100:
    name: Minute · 纳指100
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'minute' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'ndx100')) }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: ndx100
      mode: minute

  minute-sp500:
    name: Minute · 标普500
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'minute' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'sp500')) }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: sp500
      mode: minute

  minute-hsi:
    name: Minute · 恒生HSI
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'minute' && (github.event.inputs.index == 'all' || github.event.inputs.index == 'hsi')) }}
    uses: ./.github/workflows/step-data.yml
    with:
      index: hsi
      mode: minute